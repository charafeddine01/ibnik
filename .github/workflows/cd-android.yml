name: Android Continuous Delivery (Google Play)

on:
  push:
    tags:
      - 'v*.*.*' # Triggered when a new release tag is created
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy_android:
    name: Build & Release to Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Install Fastlane & Gems
        working-directory: apps/mobile/android
        run: |
          gem install bundler
          bundle install || gem install fastlane

      - name: Decode Android Keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          else
            echo "Skipping keystore decode - test build mode"
          fi

      - name: Decode Google Play Service Account Key
        working-directory: apps/mobile/android
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_KEY_JSON" ]; then
            echo "$PLAY_KEY_JSON" > play-store-key.json
          else
            echo "Skipping Play Store credentials - build only mode"
          fi

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Deploy via Fastlane
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRACK: ${{ github.event.inputs.track || 'internal' }}
        run: |
          bundle exec fastlane deploy_play_store track:$TRACK || bundle exec fastlane build_aab
