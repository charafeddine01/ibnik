name: Android Continuous Delivery (Google Play & APK Release)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy_android:
    name: Build & Release Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Install Fastlane & Gems
        working-directory: apps/mobile/android
        run: |
          gem install bundler
          bundle install || gem install fastlane

      - name: Configure Signing Keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/ibnik-upload-key.jks
            cat <<EOF > key.properties
storePassword=${KEYSTORE_PASSWORD:-IbnikProduction2026Key}
keyPassword=${KEY_PASSWORD:-IbnikProduction2026Key}
keyAlias=${KEY_ALIAS:-ibnik}
storeFile=ibnik-upload-key.jks
EOF
            echo "Keystore and key.properties created."
          else
            echo "No keystore secret found, proceeding with default unsigned/debug configuration."
          fi

      - name: Configure Google Play Service Account Key
        working-directory: apps/mobile/android
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_KEY_JSON" ]; then
            echo "$PLAY_KEY_JSON" > play-store-key.json
            echo "Google Play service account key written."
          fi

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Signed APK
        working-directory: apps/mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Signed App Bundle (AAB)
        working-directory: apps/mobile
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ibnik-android-release
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play Console
        working-directory: apps/mobile/android
        env:
          TRACK: ${{ github.event.inputs.track || 'internal' }}
        run: |
          if [ -f "play-store-key.json" ]; then
            bundle exec fastlane deploy_play_store track:$TRACK
          else
            echo "Google Play service account key not present. Skipping automated Play Store upload. Artifacts are safely stored in workflow outputs."
          fi
