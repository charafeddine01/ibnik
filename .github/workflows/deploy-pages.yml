name: "Deploy Landing Page & Privacy Policy to GitHub Pages"

on:
  push:
    branches:
      - production
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Dynamic Version Metadata
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.13")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cd --date=format:'%B %d, %Y')
          
          mkdir -p web/landing public_html
          cat <<EOF > public_html/version.json
          {
            "version": "${TAG}",
            "commit": "${COMMIT}",
            "releaseDate": "${DATE}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-release-${TAG}.apk",
            "repoUrl": "https://github.com/${{ github.repository }}",
            "status": "Online"
          }
          EOF
          cp public_html/version.json web/landing/version.json
          echo "Generated version.json:"
          cat public_html/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
