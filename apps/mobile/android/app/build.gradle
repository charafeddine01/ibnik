plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.charafeddine.ibnik"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.charafeddine.ibnik"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties.getProperty('keyAlias', 'ibnik').trim()
                keyPassword keystoreProperties.getProperty('keyPassword', 'IbnikProduction2026Key').trim()
                def storeFilePath = keystoreProperties.getProperty('storeFile', 'ibnik-upload-key.jks').trim()
                if (storeFilePath.startsWith("app/")) {
                    storeFile rootProject.file(storeFilePath)
                } else {
                    storeFile rootProject.file("app/${storeFilePath}")
                }
                storePassword keystoreProperties.getProperty('storePassword', 'IbnikProduction2026Key').trim()
            } else if (System.getenv("KEYSTORE_PASSWORD") != null) {
                keyAlias System.getenv("KEY_ALIAS") ?: "ibnik"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
                storeFile file("ibnik-upload-key.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
