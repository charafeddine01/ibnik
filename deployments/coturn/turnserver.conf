# Coturn STUN/TURN Configuration for Baby Monitor
# Domain: turn.charafeddine.xyz

# Listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay port range (UDP) - Ensure these ports are open in Oracle Cloud / AWS Security Group
min-port=49152
max-port=65535

# Realm matching your subdomain
realm=turn.charafeddine.xyz
server-name=turn.charafeddine.xyz

# Dynamic HMAC-SHA1 authentication (RFC 5766 TURN REST API)
# The signaling server generates short-lived credentials using this secret
use-auth-secret
static-auth-secret=babymonitor-dev-secret-change-in-prod

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Security: prevent loops and attacks
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Performance tuning
mobility
no-cli
log-file=stdout
simple-log
